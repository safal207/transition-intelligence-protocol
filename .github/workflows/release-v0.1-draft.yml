name: Publish v0.1-draft

on:
  workflow_run:
    workflows: ["Validate protocol family"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout validated main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bind bookkeeping to validated head
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"

      - name: Publish v0.1-draft when absent
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if ! gh release view v0.1-draft --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.1-draft \
              --repo "$GITHUB_REPOSITORY" \
              --target "$VALIDATED_SHA" \
              --title "Transition Intelligence Protocol v0.1-draft" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Synchronize release bookkeeping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TARGET="$(gh release view v0.1-draft --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          repo = os.environ["GITHUB_REPOSITORY"]
          release_target = os.environ["RELEASE_TARGET"]
          release_url = f"https://github.com/{repo}/releases/tag/v0.1-draft"

          notes = Path("RELEASE_NOTES.md")
          text = notes.read_text(encoding="utf-8")
          text = text.replace(
              "Status: release marker ready; tag or GitHub Release still to be created.",
              f"Status: Published as GitHub Release `v0.1-draft` from validated commit `{release_target}`.",
          )
          text = text.replace(
              "The repository is ready for a `v0.1-draft` tag or GitHub Release after the release-preparation commit itself receives a successful `Validate protocol family` run.",
              f"GitHub Release `v0.1-draft` is published from validated commit `{release_target}`: {release_url}",
          )
          notes.write_text(text, encoding="utf-8")

          backlog = Path("BACKLOG.md")
          text = backlog.read_text(encoding="utf-8")
          replacement = f'''### 5.2 Create v0.1-draft marker

Status: Done

Completed:

- implementation head `10bb5c77adeecea1a229657c18238d87a3ffc174` passed workflow run `30923751747`;
- release-preparation head `f298ba3a71ad8a4437507162b7fd7ab143d04107` passed workflow run `31584460771`;
- release automation head `a66adf7f087f4529a4212816ffedf67f5c41e30f` passed workflow run `31586895835`;
- GitHub Release `v0.1-draft` was published from validated commit `{release_target}`;
- release notes and repository documentation identify the same v0.1-draft scope.

Definition of Done:

- the marker points to a green `main` commit;
- release notes and marker identify the same v0.1-draft scope.
'''
          text, count = re.subn(
              r"### 5\.2 Create v0\.1-draft marker\n.*?(?=\n## Discovery — Human memory representation)",
              replacement.rstrip(),
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Expected one Epic 5.2 section, found {count}")
          backlog.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          marker = "**Latest stable checkpoint:**"
          line = f"**Latest stable checkpoint:** [`v0.1-draft`]({release_url}) — first validated protocol-family release.\n\n"
          if marker not in text:
              anchor = "**Transition Intelligence Protocol** is a framework"
              text = text.replace(anchor, line + anchor, 1)
          readme.write_text(text, encoding="utf-8")

          roadmap = Path("ROADMAP.md")
          text = roadmap.read_text(encoding="utf-8")
          text = text.replace(
              "Create a public release or tag after the validation workflow is visibly successful on `main`.",
              f"Published: GitHub Release `v0.1-draft` from validated commit `{release_target}`.",
          )
          roadmap.write_text(text, encoding="utf-8")
          PY
        env:
          RELEASE_TARGET: ${{ env.RELEASE_TARGET }}

      - name: Commit bookkeeping when changed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BACKLOG.md README.md ROADMAP.md RELEASE_NOTES.md
          git commit -m "Close v0.1-draft release marker"
          git push origin HEAD:main

      - name: Synchronize GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v0.1-draft --repo "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md
